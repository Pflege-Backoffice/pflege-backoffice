#
# Zugangsdaten kommen aus Umgebungsvariablen (siehe .env.example). Die Standardwerte
# nach dem Doppelpunkt sind NUR lokale Entwicklungswerte und passen zu .env.example.

quarkus.application.name=pflege-backoffice
quarkus.http.port=8080

# ---------- MySQL (eine Datenbank fuer Engine-Tabellen ACT_* und eigene Tabellen) ----------
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${MYSQL_USER:pflege}
quarkus.datasource.password=${MYSQL_PASSWORD:pflege-dev}
# sendFractionalSeconds=false: von Camunda/CIB seven fuer MySQL empfohlen
quarkus.datasource.jdbc.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:pflege_backoffice}?sendFractionalSeconds=false
# Die BPMN-Engine verlangt READ_COMMITTED (MySQL-Standard ist REPEATABLE_READ)
quarkus.datasource.jdbc.transaction-isolation-level=read-committed
# Wir nutzen den MySQL-Container aus docker-compose.yml, keine automatisch gestarteten Dev Services
quarkus.datasource.devservices.enabled=false
quarkus.compose.devservices.enabled=false

# Hibernate legt die eigenen Tabellen an bzw. passt sie an (in Tests: jedes Mal neu)
quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ---------- CIB seven (BPMN-Engine) ----------
# Engine-Tabellen beim Start anlegen/aktualisieren
quarkus.cibseven.generic-config.database-schema-update=true
quarkus.cibseven.generic-config.history=full

# ---------- ActiveMQ Classic (JMS) ----------
camel.component.activemq.broker-url=tcp://${ACTIVEMQ_HOST:localhost}:${ACTIVEMQ_PORT:61616}
camel.component.activemq.username=${ACTIVEMQ_USER:pflege}
camel.component.activemq.password=${ACTIVEMQ_PASSWORD:pflege-dev}

# ---------- OpenAPI / Swagger UI (/q/swagger-ui) ----------
mp.openapi.extensions.smallrye.info-title=Pflege-Backoffice MVP API
mp.openapi.extensions.smallrye.info-version=0.1.0
mp.openapi.extensions.smallrye.info-description=Gemeinsame REST-API aller Teams. Alle Pfade unter /api/v1/...
mp.openapi.extensions.smallrye.info-license.name=MIT
quarkus.swagger-ui.title=Pflege-Backoffice MVP

# ---------- Hello-Prozess ----------
# Relativ zum Arbeitsverzeichnis (bei ./mvnw quarkus:dev: der Ordner app/)
hello.ausgang.verzeichnis=target/hello/ausgang
hello.backend.eingang=target/hello/backend-eingang
# Esper-Zeitfenster: so lange wird auf eine Backend-Antwort gewartet
hello.esper.timeout-sekunden=120
%test.hello.esper.timeout-sekunden=3

# KI-GENERIERT ENDE (Claude Code, Anthropic)
