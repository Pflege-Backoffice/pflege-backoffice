# Lokale Infrastruktur: MySQL + ActiveMQ Classic. Zugangsdaten aus .env (Vorlage: .env.example).
# Start: docker compose up -d     Stopp: docker compose down     Alles loeschen: docker compose down -v
# Optional mit CIB-seven-Oberflaeche (Cockpit, Tasklist, Admin): docker compose --profile ui up -d

services:
  mysql:
    image: mysql:8.4
    container_name: pflege-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Bitte .env aus .env.example anlegen}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-daten:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  activemq:
    image: apache/activemq-classic:6.2.0
    container_name: pflege-activemq
    environment:
      ACTIVEMQ_CONNECTION_USER: ${ACTIVEMQ_USER:?Bitte .env aus .env.example anlegen}
      ACTIVEMQ_CONNECTION_PASSWORD: ${ACTIVEMQ_PASSWORD}
      ACTIVEMQ_WEB_USER: ${ACTIVEMQ_WEB_USER}
      ACTIVEMQ_WEB_PASSWORD: ${ACTIVEMQ_WEB_PASSWORD}
    ports:
      - "${ACTIVEMQ_PORT:-61616}:61616"    # JMS (OpenWire)
      - "${ACTIVEMQ_WEB_PORT:-8161}:8161"  # Web-Konsole: http://localhost:8161/admin

  # Optional (Profil "ui"): CIB seven Run nur als Oberflaeche auf derselben Datenbank.
  # Unsere Engine laeuft in Quarkus; dieser Container zeigt deren Daten an (Cockpit, Tasklist, Admin).
  # Er fuehrt KEINE Jobs aus (Timer, asynchrone Fortsetzungen), denn unsere Java-Delegates gibt es
  # nur in der Quarkus-Anwendung. Oberflaeche: http://localhost:8090  (Anmeldung demo / demo)
  cibseven-ui:
    image: cibseven/cibseven:run-2.2.0     # gleiche Version wie die Engine in Quarkus (pom.xml)
    container_name: pflege-cibseven-ui
    profiles: ["ui"]
    command: ["./cibseven.sh", "--webapps", "--rest"]
    environment:
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?sendFractionalSeconds=false
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_HIKARI_TRANSACTION_ISOLATION: TRANSACTION_READ_COMMITTED  # verlangt die Engine
      CAMUNDA_BPM_JOBEXECUTION_ENABLED: "false"   # keine Jobs ausfuehren (siehe oben)
      CAMUNDA_BPM_RUN_EXAMPLE_ENABLED: "false"    # kein Rechnungs-Beispielprozess
      CAMUNDA_BPM_HISTORYLEVEL: full              # muss zur Quarkus-Engine passen
      AI_AGENT_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${CIBSEVEN_UI_PORT:-8090}:8080"

volumes:
  mysql-daten:
# KI-GENERIERT ENDE (Claude Code, Anthropic)
